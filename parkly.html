<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Spotly</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --accent-blue: #3b82f6;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --glass-bg: rgba(15, 23, 42, 0.95);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    html, body { 
      height: 100%; 
      width: 100%; 
      overflow: hidden; 
      background: var(--bg-main); 
      color: var(--text-main); 
    }
    
    /* Layout fix bazat pe Grid: Header / Continut / BottomNav */
    #app { 
      display: grid; 
      grid-template-rows: auto 1fr auto; 
      height: 100vh; 
      height: 100dvh; /* Garantează încadrarea pe browsere mobile cu bară de adresă dinamică */
      width: 100vw; 
      position: relative; 
      overflow: hidden;
    }
    
    /* Header */
    header { 
      background: var(--glass-bg); 
      border-bottom: 1px solid var(--border-color); 
      padding: 12px 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      z-index: 2000; 
      padding-top: max(12px, env(safe-area-inset-top));
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; color: white; }
    .brand h1 { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
    
    .badge-credits { 
      background: rgba(16, 185, 129, 0.12); 
      border: 1px solid rgba(16, 185, 129, 0.3); 
      color: var(--accent-emerald); 
      padding: 6px 12px; 
      border-radius: 20px; 
      font-size: 0.85rem; 
      font-weight: 600; 
    }

    .status-banner { background: #7c2d12; color: #fdba74; padding: 8px 16px; font-size: 0.8rem; text-align: center; font-weight: 500; }

    /* Containerul principal pentru views */
    .main-content {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Views */
    .view { 
      display: none; 
      width: 100%; 
      height: 100%; 
      position: absolute; 
      top: 0; 
      left: 0; 
    }
    .view.active { display: flex; flex-direction: column; }
    
    /* Hartă */
    #map { width: 100%; height: 100%; z-index: 1; }
    .leaflet-tile { filter: brightness(0.9) contrast(1.1) invert(0.9) hue-rotate(190deg) sat:0.3; }

    /* Controls Overlay pe Harta */
    .controls-overlay { 
      position: absolute; 
      bottom: 16px; 
      left: 16px; 
      right: 16px; 
      z-index: 999; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
    }
    
    .btn { 
      border: none; 
      padding: 14px 20px; 
      border-radius: 12px; 
      font-size: 0.95rem; 
      font-weight: 600; 
      cursor: pointer; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      gap: 8px; 
      box-shadow: 0 4px 16px rgba(0,0,0,0.4); 
    }
    
    .btn:active { transform: scale(0.97); }
    .btn-emerald { background: var(--accent-emerald); color: white; }
    .btn-slate { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); }

    /* Bottom Navigation Bar - Pozitiv Stratificat (z-index 2000) */
    .bottom-nav { 
      background: #090d16; 
      border-top: 1px solid var(--border-color); 
      display: flex; 
      justify-content: space-around; 
      align-items: center;
      padding-top: 10px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 2000; 
      position: relative;
    }

    .nav-item { 
      background: none; 
      border: none; 
      color: var(--text-muted); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 4px; 
      font-size: 0.75rem; 
      font-weight: 600; 
      cursor: pointer; 
      flex: 1; 
    }

    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    .nav-item.active { color: var(--accent-blue); }

    /* Discover View */
    #discover-view { padding: 16px; overflow-y: auto; background: var(--bg-main); }
    .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 8px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    
    .cat-chip { 
      background: var(--bg-card); 
      color: var(--text-muted); 
      border: 1px solid var(--border-color); 
      padding: 8px 16px; 
      border-radius: 20px; 
      font-size: 0.85rem; 
      font-weight: 500; 
      white-space: nowrap; 
      cursor: pointer; 
    }

    .cat-chip.selected { 
      background: var(--accent-blue); 
      color: white; 
      border-color: var(--accent-blue); 
      font-weight: 600; 
    }
    
    .places-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    
    .place-card { 
      background: var(--bg-card); 
      border: 1px solid var(--border-color); 
      border-radius: 14px; 
      padding: 14px 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }

    .place-info h4 { font-size: 0.95rem; font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
    .place-info p { font-size: 0.8rem; color: var(--text-muted); text-transform: capitalize; }
    .place-distance { font-size: 0.85rem; font-weight: 700; color: var(--accent-blue); background: rgba(59, 130, 246, 0.1); padding: 4px 10px; border-radius: 8px; }

    /* Custom Leaflet Popup */
    .leaflet-popup-content-wrapper { background: var(--bg-card) !important; color: var(--text-main) !important; border-radius: 12px !important; border: 1px solid var(--border-color); }
    .leaflet-popup-tip { background: var(--bg-card) !important; }
    .popup-content { text-align: center; padding: 4px; }
    .popup-btn { margin-top: 8px; background: var(--accent-blue); color: white; border: none; padding: 6px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <div class="brand-icon">S</div>
      <h1>Spotly</h1>
    </div>
    <div class="badge-credits" id="credit-display">
      ⚡ 5 Credite
    </div>
  </header>

  <main class="main-content">
    <div id="gps-status" class="status-banner" style="display:none;"></div>

    <!-- Tab 1: Map View -->
    <div id="map-view" class="view active">
      <div id="map"></div>
      <div class="controls-overlay">
        <button class="btn btn-emerald" onclick="announceLeaving()">
          📍 Părăsesc locul (+1 Credit)
        </button>
        <button class="btn btn-slate" onclick="requestGPSLocation()">
          🎯 Recentrează harta
        </button>
      </div>
    </div>

    <!-- Tab 2: Discover View -->
    <div id="discover-view" class="view">
      <div class="categories">
        <button class="cat-chip selected" onclick="filterPlaces('fast_food', this)">🥙 Fast Food</button>
        <button class="cat-chip" onclick="filterPlaces('restaurant', this)">🍽️ Restaurante</button>
        <button class="cat-chip" onclick="filterPlaces('cafe', this)">☕ Cafele</button>
        <button class="cat-chip" onclick="filterPlaces('mall', this)">🛍️ Shopping</button>
        <button class="cat-chip" onclick="filterPlaces('attraction', this)">🏛️ Atracții</button>
      </div>
      <div class="places-list" id="places-container">
        <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 30px;">Se caută locuri din apropiere...</p>
      </div>
    </div>
  </main>

  <!-- Navigația de jos (Plasată pe rândul 3 fix din CSS Grid) -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('map-view', this)">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
      Parcare
    </button>
    <button class="nav-item" onclick="switchTab('discover-view', this)">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      În zonă
    </button>
  </nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  let map, userMarker;
  let userCoords = [44.4323, 26.1063]; 
  let spots = JSON.parse(localStorage.getItem('park_spots') || '[]');
  let credits = parseInt(localStorage.getItem('park_credits') || '5');
  let currentCategory = 'fast_food';

  function initMap() {
    map = L.map('map', { zoomControl: false }).setView(userCoords, 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    updateCreditsDisplay();
    renderSpots();
    requestGPSLocation();
  }

  function showStatus(msg) {
    const el = document.getElementById('gps-status');
    el.innerText = msg;
    el.style.display = 'block';
  }

  function hideStatus() {
    document.getElementById('gps-status').style.display = 'none';
  }

  function requestGPSLocation() {
    if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
      showStatus('⚠️ Aplicația nu e deschisă pe HTTPS. GPS-ul exact este blocat de browser.');
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          hideStatus();
          userCoords = [pos.coords.latitude, pos.coords.longitude];
          updateUserMarker();
          fetchNearbyPlaces();
        },
        (err) => {
          showStatus('⚠️ Semnal GPS nedetectat. Se folosește o poziție estimată.');
          fallbackIPLocation();
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
      );
    } else {
      fallbackIPLocation();
    }
  }

  async function fallbackIPLocation() {
    try {
      const res = await fetch('https://ipapi.co/json/');
      const data = await res.json();
      if (data.latitude && data.longitude) {
        userCoords = [data.latitude, data.longitude];
        updateUserMarker();
        fetchNearbyPlaces();
      }
    } catch(e) {
      fetchNearbyPlaces();
    }
  }

  function updateUserMarker() {
    if (!userMarker) {
      userMarker = L.marker(userCoords).addTo(map).bindPopup("<b>Poziția ta</b>");
    } else {
      userMarker.setLatLng(userCoords);
    }
    map.setView(userCoords, 15);
  }

  function switchTab(tabId, el) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    el.classList.add('active');
    if (tabId === 'map-view') setTimeout(() => map.invalidateSize(), 100);
  }

  function announceLeaving() {
    const spot = {
      id: Date.now(),
      lat: userCoords[0] + (Math.random() - 0.5) * 0.001,
      lng: userCoords[1] + (Math.random() - 0.5) * 0.001,
      timestamp: Date.now(),
      expiresAt: Date.now() + 5 * 60 * 1000
    };
    spots.push(spot);
    saveSpots();
    renderSpots();
    credits += 1;
    saveCredits();
    alert('Loc raportat! Ai primit 1 Credit.');
  }

  function claimSpot(id) {
    if (credits < 1) { alert('Nu ai destule credite!'); return; }
    spots = spots.filter(s => s.id !== id);
    credits -= 1;
    saveSpots();
    saveCredits();
    renderSpots();
    alert('Loc rezervat!');
  }

  function renderSpots() {
    map.eachLayer((layer) => {
      if (layer instanceof L.Marker && layer !== userMarker) map.removeLayer(layer);
    });
    const now = Date.now();
    spots = spots.filter(s => s.expiresAt > now);
    saveSpots();
    spots.forEach(spot => {
      const minutesLeft = Math.ceil((spot.expiresAt - now) / 60000);
      const marker = L.marker([spot.lat, spot.lng]).addTo(map);
      marker.bindPopup(`
        <div class="popup-content">
          <strong style="font-size: 0.95rem;">Loc disponibil</strong><br>
          <span style="font-size: 0.8rem; color: #94a3b8;">Se eliberează în ~${minutesLeft} min</span><br>
          <button class="popup-btn" onclick="claimSpot(${spot.id})">Rezervă (1 Credit)</button>
        </div>
      `);
    });
  }

  async function fetchNearbyPlaces() {
    const container = document.getElementById('places-container');
    container.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 30px;">Se caută locuri din apropiere...</p>';

    let filterQuery = '';
    if (currentCategory === 'fast_food') filterQuery = 'node["amenity"="fast_food"]';
    else if (currentCategory === 'restaurant') filterQuery = 'node["amenity"="restaurant"]';
    else if (currentCategory === 'cafe') filterQuery = 'node["amenity"="cafe"]';
    else if (currentCategory === 'mall') filterQuery = 'node["shop"]';
    else if (currentCategory === 'attraction') filterQuery = 'node["tourism"]';

    const radius = 3000;
    const rawQuery = `[out:json][timeout:10];${filterQuery}(around:${radius},${userCoords[0]},${userCoords[1]});out body 20;`;
    const endpoints = [
      'https://overpass-api.de/api/interpreter?data=',
      'https://overpass.kumi.systems/api/interpreter?data='
    ];

    for (const endpoint of endpoints) {
      try {
        const res = await fetch(endpoint + encodeURIComponent(rawQuery));
        if (!res.ok) continue;
        const data = await res.json();
        
        container.innerHTML = '';
        if (!data.elements || data.elements.length === 0) {
          container.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 30px;">Nu s-au găsit locații în zonă.</p>';
          return;
        }

        data.elements.forEach(place => {
          const name = (place.tags && place.tags.name) ? place.tags.name : 'Locație fără nume';
          const dist = getDistance(userCoords[0], userCoords[1], place.lat, place.lon).toFixed(1);
          const subType = (place.tags && (place.tags.cuisine || place.tags.shop || place.tags.tourism || place.tags.amenity)) || 'Punct de interes';

          const card = document.createElement('div');
          card.className = 'place-card';
          card.innerHTML = `
            <div class="place-info">
              <h4>${name}</h4>
              <p>${subType}</p>
            </div>
            <div class="place-distance">${dist} km</div>
          `;
          container.appendChild(card);
        });
        return;
      } catch (err) {}
    }
    container.innerHTML = '<p style="text-align: center; color: #ef4444; font-size: 0.9rem; margin-top: 30px;">Nu s-au putut încărca locurile.</p>';
  }

  function filterPlaces(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('selected'));
    btn.classList.add('selected');
    fetchNearbyPlaces();
  }

  function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function saveSpots() { localStorage.setItem('park_spots', JSON.stringify(spots)); }
  function saveCredits() { localStorage.setItem('park_credits', credits.toString()); updateCreditsDisplay(); }
  function updateCreditsDisplay() { document.getElementById('credit-display').innerText = `⚡ ${credits} Credite`; }

  window.onload = initMap;
</script>
</body>
</html>
